<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMaster Lula</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f0f2f5; }
        .nav { display: flex; background: #1a73e8; width: 100%; position: sticky; top: 0; }
        .nav button { flex: 1; padding: 20px 5px; border: 1px solid #ffffff44; background: #1a73e8; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        .nav button:active { background: #000; color: #fff; }
        .container { padding: 15px; max-width: 500px; margin: auto; }
        .view { display: none; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .view.active { display: block; }
        input, textarea, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; box-sizing: border-box; }
        .btn-save { background: #1a73e8; color: white; border: none; font-weight: bold; }
        .btn-csv { background: #28a745; color: white; border: none; font-weight: bold; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="nav">
    <button id="btn-agenda">AGENDA</button>
    <button id="btn-tcc1">TCC PENS.</button>
    <button id="btn-tcc2">TCC EMOC.</button>
</div>

<div class="container">
    <button class="btn-csv" id="btn-export">📥 BAIXAR BACKUP (PIPE |)</button>

    <div id="view-agenda" class="view active">
        <h3>📅 Agenda Diária</h3>
        <input type="text" id="v1a" placeholder="Tarefa">
        <input type="date" id="v2a">
        <input type="time" id="v3a">
        <button class="btn-save" id="save-agenda">SALVAR AGENDA</button>
    </div>

    <div id="view-tcc1" class="view">
        <h3>🧠 Pensamentos (TCC)</h3>
        <textarea id="v1p" placeholder="Situação"></textarea>
        <input type="text" id="v2p" placeholder="Emoção">
        <textarea id="v3p" placeholder="Pensamento Automático"></textarea>
        <textarea id="v4p" placeholder="Comportamento"></textarea>
        <button class="btn-save" id="save-tcc1">SALVAR PENSAMENTO</button>
    </div>

    <div id="view-tcc2" class="view">
        <h3>🎭 Emoções (TCC)</h3>
        <input type="text" id="e1" placeholder="Dia/Situação">
        <input type="text" id="e2" placeholder="Emoção">
        <input type="number" id="e3" placeholder="Intensidade (0-10)">
        <textarea id="e4" placeholder="Reação"></textarea>
        <button class="btn-save" id="save-tcc2">SALVAR EMOÇÃO</button>
    </div>
</div>

<script>
    const DB_KEY = 'LULA_DB_FINAL_V20';
    let data = JSON.parse(localStorage.getItem(DB_KEY)) || [];

    // Função para trocar de aba
    function changeTab(tabId) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
    }

    // Ouvintes de Clique (Mais estável que onclick)
    document.getElementById('btn-agenda').addEventListener('click', () => changeTab('agenda'));
    document.getElementById('btn-tcc1').addEventListener('click', () => changeTab('tcc1'));
    document.getElementById('btn-tcc2').addEventListener('click', () => changeTab('tcc2'));

    // Função Salvar Genérica
    function saveData(tipo, fields) {
        const entry = {
            tipo: tipo,
            c1: document.getElementById(fields[0]).value,
            c2: document.getElementById(fields[1]).value,
            c3: document.getElementById(fields[2]).value,
            c4: fields[3] ? document.getElementById(fields[3]).value : '-',
            data: new Date().toLocaleString('pt-BR')
        };
        
        if(!entry.c1) return alert("Preencha o campo principal!");
        
        data.push(entry);
        localStorage.setItem(DB_KEY, JSON.stringify(data));
        alert("Salvo com sucesso!");
        
        fields.forEach(f => { if(f) document.getElementById(f).value = ''; });
    }

    document.getElementById('save-agenda').addEventListener('click', () => saveData('AGENDA', ['v1a', 'v2a', 'v3a']));
    document.getElementById('save-tcc1').addEventListener('click', () => saveData('TCC_PENS', ['v1p', 'v2p', 'v3p', 'v4p']));
    document.getElementById('save-tcc2').addEventListener('click', () => saveData('TCC_EMOC', ['e1', 'e2', 'e3', 'e4']));

    document.getElementById('btn-export').addEventListener('click', () => {
        if (data.length === 0) return alert("Não há dados!");
        let csv = "TIPO|CAMPO1|CAMPO2|CAMPO3|CAMPO4|DATA_REGISTRO\n";
        data.forEach(i => { csv += ${i.tipo}|${i.c1}|${i.c2}|${i.c3}|${i.c4}|${i.data}\n; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'backup_lula.csv';
        a.click();
    });
</script>
</body>
</html>
