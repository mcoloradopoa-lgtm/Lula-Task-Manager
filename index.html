<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TaskMaster & TCC</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a73e8">
    <style>
        :root { --primary: #1a73e8; --bg: #f4f7f6; --card: #ffffff; }
        body { font-family: -apple-system, sans-serif; background-color: var(--bg); margin: 0; padding: 0; }
        nav { background: var(--primary); display: flex; justify-content: space-around; padding: 15px 0; position: sticky; top: 0; z-index: 100; }
        nav button { background: none; border: none; color: white; font-weight: bold; font-size: 0.8rem; cursor: pointer; opacity: 0.7; }
        nav button.active { opacity: 1; border-bottom: 2px solid white; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        .view { display: none; }
        .view.active { display: block; }
        .card { background: var(--card); padding: 18px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { color: var(--primary); font-size: 1.2rem; text-align: center; margin-top: 0; }
        input, textarea, button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid #ddd; font-size: 16px; box-sizing: border-box; }
        button.btn-save { background: var(--primary); color: white; border: none; font-weight: bold; }
        .list-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--primary); box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .del-btn { position: absolute; right: 10px; top: 10px; background: #fee; color: #c00; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; }
        .label-tcc { font-size: 0.8rem; font-weight: bold; color: #666; margin-top: 5px; display: block; }
    </style>
</head>
<body>

    <nav>
        <button onclick="showView('agenda')" id="nav-agenda" class="active">📅 AGENDA</button>
        <button onclick="showView('pensamentos')" id="nav-pensamentos">🧠 PENSAMENTOS</button>
        <button onclick="showView('emocoes')" id="nav-emocoes">🎭 EMOÇÕES</button>
    </nav>

    <div class="container">
        
        <div id="view-agenda" class="view active">
            <h2>Minha Agenda</h2>
            <div class="card">
                <input type="text" id="taskName" placeholder="O que precisa de fazer?">
                <div style="display:flex; gap:10px;">
                    <input type="date" id="taskDate">
                    <input type="time" id="taskTime">
                </div>
                <button class="btn-save" onclick="addAgenda()">SALVAR NA AGENDA</button>
            </div>
            <div id="list-agenda"></div>
        </div>

        <div id="view-pensamentos" class="view">
            <h2>Diário de Pensamentos</h2>
            <div class="card">
                <textarea id="p-situacao" placeholder="Situação (O que aconteceu?)"></textarea>
                <input type="text" id="p-emocao" placeholder="Emoção sentida">
                <textarea id="p-pensamento" placeholder="Pensamento Automático"></textarea>
                <textarea id="p-comportamento" placeholder="Comportamento Resultado"></textarea>
                <button class="btn-save" onclick="addItem('pensamentos', ['p-situacao', 'p-emocao', 'p-pensamento', 'p-comportamento'])">REGISTAR TCC</button>
            </div>
            <div id="list-pensamentos"></div>
        </div>

        <div id="view-emocoes" class="view">
            <h2>Diário de Emoções</h2>
            <div class="card">
                <input type="text" id="e-situacao" placeholder="Dia / Situação">
                <input type="text" id="e-emocao" placeholder="Qual a Emoção?">
                <input type="number" id="e-intensidade" placeholder="Intensidade (0-10)" min="0" max="10">
                <textarea id="e-reacao" placeholder="Reação / Comportamento"></textarea>
                <button class="btn-save" onclick="addItem('emocoes', ['e-situacao', 'e-emocao', 'e-intensidade', 'e-reacao'])">REGISTAR EMOÇÃO</button>
            </div>
            <div id="list-emocoes"></div>
        </div>

    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('db_lula_final')) || { agenda: [], pensamentos: [], emocoes: [] };

        function showView(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            document.getElementById('nav-' + view).classList.add('active');
            render();
        }

        function addAgenda() {
            const name = document.getElementById('taskName').value;
            const date = document.getElementById('taskDate').value;
            const time = document.getElementById('taskTime').value || "00:00";
            if(name && date) {
                db.agenda.push({ name, date, time });
                document.getElementById('taskName').value = "";
                save();
            }
        }

        function addItem(type, fields) {
            let entry = { data: new Date().toLocaleDateString('pt-BR') };
            fields.forEach(f => {
                entry[f.split('-')[1]] = document.getElementById(f).value;
                document.getElementById(f).value = "";
            });
            db[type].push(entry);
            save();
        }

        function remove(type, i) {
            if(confirm("Eliminar este registo?")) {
                db[type].splice(i, 1);
                save();
            }
        }

        function save() {
            localStorage.setItem('db_lula_final', JSON.stringify(db));
            render();
        }

        function render() {
            // Render Agenda
            const lA = document.getElementById('list-agenda');
            lA.innerHTML = db.agenda.map((item, i) => `
                <div class="list-item">
                    <div><b>${item.name}</b><br><small>${item.date.split('-').reverse().join('/')} às ${item.time}</small></div>
                    <button class="del-btn" onclick="remove('agenda', ${i})">X</button>
                </div>`).join('');

            // Render Pensamentos
            const lP = document.getElementById('list-pensamentos');
            lP.innerHTML = db.pensamentos.map((item, i) => `
                <div class="list-item">
                    <span class="label-tcc">DATA: ${item.data}</span>
                    <b>Situação:</b> ${item.situacao}<br>
                    <b>Pensamento:</b> ${item.pensamento}<br>
                    <button class="del-btn" onclick="remove('pensamentos', ${i})">X</button>
                </div>`).join('');

            // Render Emoções
            const lE = document.getElementById('list-emocoes');
            lE.innerHTML = db.emocoes.map((item, i) => `
                <div class="list-item">
                    <b>${item.emocao} (${item.intensidade}/10)</b><br>
                    <small>${item.situacao}</small>
                    <button class="del-btn" onclick="remove('emocoes', ${i})">X</button>
                </div>`).join('');
        }

        window.onload = () => {
            document.getElementById('taskDate').valueAsDate = new Date();
            render();
        };
    </script>
</body>
</html>
